<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results | VaultTrack</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="page-container">
        <header class="app-header">
            <div class="header-inner">
                <a href="dashboard.html" class="brand">
                     <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="VaultTrack logo">
                        <path d="M3 7L12 19L21 7" stroke="url(#v-grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                        <defs>
                            <linearGradient id="v-grad" x1="0" y1="0" x2="24" y2="0">
                                <stop stop-color="#4f46e5"/>
                                <stop offset="1" stop-color="#7c3aed"/>
                            </linearGradient>
                        </defs>
                    </svg>
                     <span>VaultTrack</span>
                </a>
                <button type="button" class="nav-toggle" aria-label="Toggle navigation">☰</button>
                <nav class="main-nav">
                    <a href="dashboard.html" class="nav-link">Dashboard</a>
                    <a href="index.html" class="nav-link">Products</a>
                    <a href="purchases.html" class="nav-link">Purchases</a>
                    <a href="warranties.html" class="nav-link">Warranties</a>
                    <a href="service-records.html" class="nav-link">Service Records</a>
                </nav>
                <div class="header-actions">
                    <form id="global-search-form" class="header-search" action="search-results.html" method="GET">
                        <input id="global-search" type="search" class="header-search-input" placeholder="Search products, warranties..." autocomplete="off">
                        <button type="submit" class="header-search-btn" aria-label="Search">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        </button>
                    </form>
                    <div class="header-actions-right">
                        <button type="button" class="header-icon-btn" id="notification-trigger" aria-label="Notifications" aria-haspopup="true" aria-expanded="false">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
                            <span id="notification-badge" class="header-icon-badge" style="display:none">0</span>
                        </button>
                        <div class="user-menu hidden" id="user-menu">
                            <button type="button" class="user-menu-trigger" id="user-menu-trigger" aria-haspopup="true" aria-expanded="false">
                                <span class="user-avatar" id="user-avatar">U</span>
                                <span class="user-name" id="user-name-display">User</span>
                                <span class="user-menu-arrow">▼</span>
                            </button>
                            <div class="user-menu-dropdown" id="user-menu-dropdown">
                                <a href="profile.html" class="user-menu-item">Profile</a>
                                <a href="settings.html" class="user-menu-item">Settings</a>
                                <div class="user-menu-divider"></div>
                                <button type="button" class="user-menu-item user-menu-logout" id="header-logout">Logout</button>
                            </div>
                        </div>
                        <div class="notification-dropdown" id="notification-dropdown">
                            <div class="notification-dropdown-header">
                                <span class="notification-dropdown-title">Notifications</span>
                            </div>
                            <div id="notification-empty" class="notification-empty">No notifications</div>
                            <div id="notification-list" class="notification-list"></div>
                        </div>
                    </div>
                </div>
            </div>
        </header>
        <main class="main-content app-body">
            <div class="page-header page-header--enhanced">
                <div>
                    <h1 class="page-title">Search Results</h1>
                    <p class="page-subtitle" id="search-subtitle">Enter a query to search across your inventory.</p>
                </div>
            </div>
            <p id="message" class="message" aria-live="polite"></p>

            <section class="card" aria-labelledby="search-results-heading">
                <div class="card-header card-header--bordered">
                    <div class="card-header-left">
                        <div class="card-header-icon card-header-icon--secondary">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        </div>
                        <div>
                            <h2 id="search-results-heading" class="card-title">Results</h2>
                            <p class="card-header-subtitle">Products, purchases, warranties, and service records</p>
                        </div>
                    </div>
                </div>
                <div class="card-body">
                    <div id="search-results-content"></div>
                </div>
            </section>
        </main>
    </div>
    <script src="js/auth.js"></script>
    <script src="js/intelligence.js"></script>
    <script>
        (async function guard() {
            const user = await checkAuth();
            if (!user) return;
            updateAuthUI(user);
            initUserMenu();
            initNotifications();
            initSearch();
            await loadSearchResults();
        })();

        const messageEl = document.getElementById("message");
        const searchSubtitle = document.getElementById("search-subtitle");
        const resultsContent = document.getElementById("search-results-content");

        function showMessage(text, isError = false) {
            messageEl.textContent = text;
            messageEl.className = `message ${isError ? "error" : "success"} visible`;
        }

        async function loadSearchResults() {
            const params = new URLSearchParams(window.location.search);
            const q = params.get("q") || "";
            if (!q) {
                searchSubtitle.textContent = "Enter a query to search across your inventory.";
                resultsContent.innerHTML = "";
                return;
            }
            searchSubtitle.textContent = `Results for "${q}"`;
            try {
                const data = await search(q);
                renderSearchResults(data, q);
            } catch (error) {
                showMessage("Could not load search results. Please try again.", true);
                resultsContent.innerHTML = "";
                console.error("Search error:", error);
            }
        }

        function renderSearchResults(data, q) {
            let html = "";
            const hasResults = (data.products && data.products.length > 0) ||
                               (data.purchases && data.purchases.length > 0) ||
                               (data.warranties && data.warranties.length > 0) ||
                               (data.services && data.services.length > 0);
            if (!hasResults) {
                html = `<div class="empty-state">
                    <div class="empty-state-icon">🔍</div>
                    <div class="empty-state-title">No results found</div>
                    <div class="empty-state-text">Try a different search term.</div>
                </div>`;
                resultsContent.innerHTML = html;
                return;
            }

            if (data.products && data.products.length > 0) {
                html += `<h3 class="card-title" style="margin-bottom:var(--spacing-md);">Products (${data.products.length})</h3>`;
                html += `<div class="table-wrapper"><table class="data-table data-table--enhanced">
                    <thead><tr><th>Name</th><th>Category</th></tr></thead>
                    <tbody>${data.products.map(p => `<tr>
                        <td>${p.name || "-"}</td>
                        <td>${p.category || "-"}</td>
                    </tr>`).join("")}</tbody>
                </table></div>`;
            }

            if (data.warranties && data.warranties.length > 0) {
                html += `<h3 class="card-title" style="margin-top:var(--spacing-lg);margin-bottom:var(--spacing-md);">Warranties (${data.warranties.length})</h3>`;
                html += `<div class="table-wrapper"><table class="data-table data-table--enhanced">
                    <thead><tr><th>Provider</th><th>Expiry Date</th><th>Status</th></tr></thead>
                    <tbody>${data.warranties.map(w => `<tr>
                        <td>${w.warrantyProvider || "-"}</td>
                        <td>${w.expiryDate || "-"}</td>
                        <td>${w.status || "-"}</td>
                    </tr>`).join("")}</tbody>
                </table></div>`;
            }

            if (data.purchases && data.purchases.length > 0) {
                html += `<h3 class="card-title" style="margin-top:var(--spacing-lg);margin-bottom:var(--spacing-md);">Purchases (${data.purchases.length})</h3>`;
                html += `<div class="table-wrapper"><table class="data-table data-table--enhanced">
                    <thead><tr><th>Store</th><th>Date</th><th>Price</th></tr></thead>
                    <tbody>${data.purchases.map(p => `<tr>
                        <td>${p.storeName || "-"}</td>
                        <td>${p.purchaseDate || "-"}</td>
                        <td>${p.purchasePrice != null ? "₹" + Number(p.purchasePrice).toLocaleString("en-IN") : "-"}</td>
                    </tr>`).join("")}</tbody>
                </table></div>`;
            }

            if (data.services && data.services.length > 0) {
                html += `<h3 class="card-title" style="margin-top:var(--spacing-lg);margin-bottom:var(--spacing-md);">Service Records (${data.services.length})</h3>`;
                html += `<div class="table-wrapper"><table class="data-table data-table--enhanced">
                    <thead><tr><th>Provider</th><th>Date</th><th>Cost</th></tr></thead>
                    <tbody>${data.services.map(s => `<tr>
                        <td>${s.provider || "-"}</td>
                        <td>${s.serviceDate || "-"}</td>
                        <td>${s.cost != null ? "₹" + Number(s.cost).toLocaleString("en-IN", {minimumFractionDigits: 2}) : "-"}</td>
                    </tr>`).join("")}</tbody>
                </table></div>`;
            }

            resultsContent.innerHTML = html;
        }
    </script>
</body>
</html>
