spring.application.name=purchase-warranty-tracker
server.port=8080

# Enable Bean Overriding to allow duplicate repository names across packages
spring.main.allow-bean-definition-overriding=true

# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:trackerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update