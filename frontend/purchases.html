<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchase Management | Purchase &amp; Warranty Tracker</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="page-container">
        <h1>Purchase &amp; Warranty Tracker</h1>
        <nav class="main-nav">
            <a href="index.html" class="nav-link">Products</a>
            <a href="purchases.html" class="nav-link active">Purchases</a>
        </nav>
        <p>Purchase Management</p>
        <p id="message" class="message" aria-live="polite"></p>

        <section class="status-card" aria-labelledby="purchase-form-heading">
            <h2 id="purchase-form-heading">Add or edit a purchase</h2>
            <form id="purchase-form">
                <input id="purchase-id" type="hidden">
                <label>Product
                    <select id="product-id" required>
                        <option value="">-- Select a product --</option>
                    </select>
                </label>
                <label>Purchase date
                    <input id="purchase-date" type="date" required>
                </label>
                <label>Purchase price (₹)
                    <input id="purchase-price" type="number" step="0.01" min="0" required placeholder="0.00">
                </label>
                <label>Store name
                    <input id="store-name" required maxlength="150" placeholder="Store or vendor name">
                </label>
                <label>Payment method
                    <select id="payment-method" required>
                        <option value="UPI">UPI</option>
                        <option value="CARD">Card</option>
                        <option value="CASH">Cash</option>
                        <option value="BANK_TRANSFER">Bank Transfer</option>
                        <option value="OTHER">Other</option>
                    </select>
                </label>
                <div class="button-row">
                    <button type="submit" id="submit-purchase-button">Save purchase</button>
                    <button id="cancel-edit-button" type="button" class="secondary">Cancel edit</button>
                </div>
            </form>
        </section>

        <section class="status-card" aria-labelledby="purchase-list-heading">
            <div class="section-header">
                <h2 id="purchase-list-heading">Purchase History</h2>
                <button id="refresh-button" type="button">Refresh list</button>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Purchase Date</th>
                            <th>Price</th>
                            <th>Store</th>
                            <th>Payment</th>
                            <th>Receipt</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="purchase-table-body"></tbody>
                </table>
            </div>
        </section>

        <section id="receipt-section" class="status-card modal-card" aria-labelledby="receipt-heading" style="display: none;">
            <div class="section-header">
                <h2 id="receipt-heading">Manage Receipt</h2>
                <button type="button" id="close-receipt-button" class="secondary">Close</button>
            </div>
            <p id="receipt-message" class="message" aria-live="polite"></p>
            <p><strong>Purchase:</strong> <span id="receipt-purchase-info"></span></p>

            <form id="receipt-form">
                <input id="receipt-purchase-id" type="hidden">
                <label>Receipt file path / reference
                    <input id="receipt-file-path" required maxlength="500" placeholder="e.g. receipts/2026/invoice.pdf">
                </label>
                <label>Receipt date
                    <input id="receipt-date" type="date" required>
                </label>
                <div class="button-row">
                    <button type="submit" id="save-receipt-button">Save receipt</button>
                    <button type="button" id="delete-receipt-button" class="danger" style="display: none;">Delete receipt</button>
                </div>
            </form>
        </section>
    </main>
    <script src="js/purchases.js"></script>
</body>
</html>
