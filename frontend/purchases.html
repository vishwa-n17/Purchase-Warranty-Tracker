<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchases | Purchase &amp; Warranty Tracker</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="page-container">
        <header class="app-header">
            <div class="header-inner">
                <a href="dashboard.html" class="brand">
                    <div class="brand-icon">P</div>
                    <span>Purchase &amp; Warranty Tracker</span>
                </a>
                <button type="button" class="nav-toggle" aria-label="Toggle navigation">☰</button>
                <nav class="main-nav">
                    <a href="dashboard.html" class="nav-link">Dashboard</a>
                    <a href="index.html" class="nav-link">Products</a>
                    <a href="purchases.html" class="nav-link active">Purchases</a>
                    <a href="warranties.html" class="nav-link">Warranties</a>
                    <a href="service-records.html" class="nav-link">Service Records</a>
                </nav>
                <div class="header-actions">
                    <div class="user-menu hidden" id="user-menu">
                        <button type="button" class="user-menu-trigger" id="user-menu-trigger" aria-haspopup="true" aria-expanded="false">
                            <span class="user-avatar" id="user-avatar">U</span>
                            <span class="user-name" id="user-name-display">User</span>
                            <span class="user-menu-arrow">▼</span>
                        </button>
                        <div class="user-menu-dropdown" id="user-menu-dropdown">
                            <a href="profile.html" class="user-menu-item">Profile</a>
                            <a href="settings.html" class="user-menu-item">Settings</a>
                            <div class="user-menu-divider"></div>
                            <button type="button" class="user-menu-item user-menu-logout" id="header-logout">Logout</button>
                        </div>
                    </div>
                </div>
            </div>
        </header>
        <main class="main-content app-body">
            <div class="page-header">
                <h1 class="page-title">Purchases</h1>
                <p class="page-subtitle">Track purchases, payments, and attached receipts.</p>
            </div>
            <p id="message" class="message" aria-live="polite"></p>

            <section class="card mb-lg" aria-labelledby="purchase-form-heading">
                <div class="card-header">
                    <h2 id="purchase-form-heading" class="card-title">Add or edit a purchase</h2>
                </div>
                <div class="card-body">
                    <form id="purchase-form">
                        <input id="purchase-id" type="hidden">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="product-id">Product</label>
                                <select id="product-id" class="form-select" required>
                                    <option value="">-- Select a product --</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="purchase-date">Purchase date</label>
                                <input id="purchase-date" type="date" class="form-input" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="purchase-price">Purchase price (₹)</label>
                                <input id="purchase-price" type="number" step="0.01" min="0" class="form-input" required placeholder="0.00">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="store-name">Store name</label>
                                <input id="store-name" class="form-input" required maxlength="150" placeholder="Store or vendor name">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="payment-method">Payment method</label>
                                <select id="payment-method" class="form-select" required>
                                    <option value="UPI">UPI</option>
                                    <option value="CARD">Card</option>
                                    <option value="CASH">Cash</option>
                                    <option value="BANK_TRANSFER">Bank Transfer</option>
                                    <option value="OTHER">Other</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button type="submit" id="submit-purchase-button" class="btn btn-primary">Save purchase</button>
                            <button id="cancel-edit-button" type="button" class="btn btn-secondary">Cancel edit</button>
                        </div>
                    </form>
                </div>
            </section>

            <section class="card" aria-labelledby="purchase-list-heading">
                <div class="card-header">
                    <h2 id="purchase-list-heading" class="card-title">Purchase History</h2>
                    <button id="refresh-button" type="button" class="btn btn-secondary btn-sm">Refresh list</button>
                </div>
                <div class="card-body" style="padding: 0;">
                    <div class="table-wrapper">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Product</th>
                                    <th>Purchase Date</th>
                                    <th>Price</th>
                                    <th>Store</th>
                                    <th>Payment</th>
                                    <th>Receipt</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="purchase-table-body"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <section id="receipt-section" class="card mt-lg" aria-labelledby="receipt-heading" style="display: none;">
                <div class="card-header">
                    <h2 id="receipt-heading" class="card-title">Manage Receipt</h2>
                    <button type="button" id="close-receipt-button" class="btn btn-secondary btn-sm">Close</button>
                </div>
                <div class="card-body">
                    <p id="receipt-message" class="message" aria-live="polite"></p>
                    <p class="text-muted" style="margin-bottom: var(--spacing-md);">
                        <strong>Purchase:</strong> <span id="receipt-purchase-info"></span>
                    </p>
                    <form id="receipt-form">
                        <input id="receipt-purchase-id" type="hidden">
                        <div class="form-group">
                            <label class="form-label" for="receipt-file-path">Receipt file path / reference</label>
                            <input id="receipt-file-path" class="form-input" required maxlength="500" placeholder="e.g. receipts/2026/invoice.pdf">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="receipt-date">Receipt date</label>
                            <input id="receipt-date" type="date" class="form-input" required>
                        </div>
                        <div class="form-actions">
                            <button type="submit" id="save-receipt-button" class="btn btn-primary">Save receipt</button>
                            <button type="button" id="delete-receipt-button" class="btn btn-danger" style="display: none;">Delete receipt</button>
                        </div>
                    </form>
                </div>
            </section>
        </main>
    </div>
    <script src="js/purchases.js"></script>
    <script>
        (async function guard() {
            const user = await checkAuth();
            if (!user) return;
            updateAuthUI(user);
            initUserMenu();
        })();
    </script>
</body>
</html>
