<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | Purchase &amp; Warranty Tracker</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="page-container">
        <header class="app-header">
            <div class="header-inner">
                <a href="index.html" class="brand">
                    <div class="brand-icon">P</div>
                    <span>Purchase &amp; Warranty Tracker</span>
                </a>
                <button type="button" class="nav-toggle" aria-label="Toggle navigation">☰</button>
                <nav class="main-nav">
                    <a href="dashboard.html" class="nav-link">Dashboard</a>
                    <a href="index.html" class="nav-link active">Products</a>
                    <a href="purchases.html" class="nav-link">Purchases</a>
                    <a href="warranties.html" class="nav-link">Warranties</a>
                    <a href="service-records.html" class="nav-link">Service Records</a>
                </nav>
                <div class="header-actions">
                    <div class="user-menu hidden" id="user-menu">
                        <button type="button" class="user-menu-trigger" id="user-menu-trigger" aria-haspopup="true" aria-expanded="false">
                            <span class="user-avatar" id="user-avatar">U</span>
                            <span class="user-name" id="user-name-display">User</span>
                            <span class="user-menu-arrow">▼</span>
                        </button>
                        <div class="user-menu-dropdown" id="user-menu-dropdown">
                            <a href="profile.html" class="user-menu-item">Profile</a>
                            <a href="settings.html" class="user-menu-item">Settings</a>
                            <div class="user-menu-divider"></div>
                            <button type="button" class="user-menu-item user-menu-logout" id="header-logout">Logout</button>
                        </div>
                    </div>
                </div>
            </div>
        </header>
        <main class="main-content app-body">
            <div class="page-header">
                <h1 class="page-title">Products</h1>
                <p class="page-subtitle">Manage your product inventory and track items under warranty or service.</p>
            </div>
            <p id="message" class="message" aria-live="polite"></p>

            <section class="card mb-lg" aria-labelledby="product-form-heading">
                <div class="card-header">
                    <h2 id="product-form-heading" class="card-title">Add or edit a product</h2>
                </div>
                <div class="card-body">
                    <form id="product-form">
                        <input id="product-id" type="hidden">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="name">Name</label>
                                <input id="name" class="form-input" required maxlength="150">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="category">Category</label>
                                <input id="category" class="form-input" required maxlength="100">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="brand">Brand</label>
                                <input id="brand" class="form-input" maxlength="100">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="model">Model</label>
                                <input id="model" class="form-input" maxlength="100">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="serial-number">Serial number</label>
                                <input id="serial-number" class="form-input" maxlength="150">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="notes">Notes</label>
                                <textarea id="notes" class="form-textarea"></textarea>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">Save product</button>
                            <button id="cancel-edit-button" type="button" class="btn btn-secondary">Cancel edit</button>
                        </div>
                    </form>
                </div>
            </section>

            <section class="card" aria-labelledby="product-list-heading">
                <div class="card-header">
                    <h2 id="product-list-heading" class="card-title">Products</h2>
                    <button id="refresh-button" type="button" class="btn btn-secondary btn-sm">Refresh list</button>
                </div>
                <div class="card-body" style="padding: 0;">
                    <div class="table-wrapper">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Category</th>
                                    <th>Brand / Model</th>
                                    <th>Serial number</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="product-table-body"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="js/products.js"></script>
    <script>
        (async function guard() {
            const user = await checkAuth();
            if (!user) return;
            updateAuthUI(user);
            initUserMenu();
        })();
    </script>
</body>
</html>
