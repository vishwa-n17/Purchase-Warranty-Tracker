<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Purchase &amp; Warranty Tracker</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">
    <div class="auth-split">
        <div class="auth-brand">
            <div class="auth-brand-content">
                <div class="auth-brand-logo">
                    <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="40" height="40" rx="10" fill="url(#brand-grad)"/>
                        <path d="M12 20L18 26L28 14" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <defs>
                            <linearGradient id="brand-grad" x1="0" y1="0" x2="40" y2="40">
                                <stop stop-color="#4f46e5"/>
                                <stop offset="1" stop-color="#7c3aed"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <h2 class="auth-brand-title">Purchase & Warranty Tracker</h2>
                <p class="auth-brand-text">Track every purchase, warranty, and service record in one premium workspace.</p>
                <div class="auth-brand-features">
                    <div class="auth-brand-feature">
                        <span class="auth-brand-feature-icon">📦</span>
                        <span>Product inventory</span>
                    </div>
                    <div class="auth-brand-feature">
                        <span class="auth-brand-feature-icon">🛡️</span>
                        <span>Warranty tracking</span>
                    </div>
                    <div class="auth-brand-feature">
                        <span class="auth-brand-feature-icon">🔧</span>
                        <span>Service history</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="auth-form-panel">
            <div class="auth-card">
                <div class="auth-header">
                    <div class="auth-logo">P</div>
                    <h1 class="auth-title">Welcome back</h1>
                    <p class="auth-subtitle">Sign in to manage your purchases, warranties, and service records.</p>
                </div>
                <p id="message" class="message" aria-live="polite"></p>
                <form id="login-form" class="auth-form" autocomplete="on">
                    <div class="form-group">
                        <label class="form-label" for="email">Email</label>
                        <input id="email" type="email" class="form-input" placeholder="you@example.com" required autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <input id="password" type="password" class="form-input" placeholder="Enter your password" required autocomplete="current-password" minlength="6">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Sign in</button>
                    </div>
                </form>
                <div class="auth-footer">
                    Don't have an account? <a href="signup.html">Create one</a>
                </div>
            </div>
        </div>
    </div>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            await handleLogin(email, password);
        });
    </script>
</body>
</html>
