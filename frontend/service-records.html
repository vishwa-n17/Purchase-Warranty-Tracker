<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Records | Purchase &amp; Warranty Tracker</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="page-container">
        <header class="app-header">
            <div class="header-inner">
                <a href="dashboard.html" class="brand">
                    <div class="brand-icon">P</div>
                    <span>Purchase &amp; Warranty Tracker</span>
                </a>
                <button type="button" class="nav-toggle" aria-label="Toggle navigation">☰</button>
                <nav class="main-nav">
                    <a href="dashboard.html" class="nav-link">Dashboard</a>
                    <a href="index.html" class="nav-link">Products</a>
                    <a href="purchases.html" class="nav-link">Purchases</a>
                    <a href="warranties.html" class="nav-link">Warranties</a>
                    <a href="service-records.html" class="nav-link active">Service Records</a>
                </nav>
                <div class="header-actions">
                    <div class="user-menu hidden" id="user-menu">
                        <button type="button" class="user-menu-trigger" id="user-menu-trigger" aria-haspopup="true" aria-expanded="false">
                            <span class="user-avatar" id="user-avatar">U</span>
                            <span class="user-name" id="user-name-display">User</span>
                            <span class="user-menu-arrow">▼</span>
                        </button>
                        <div class="user-menu-dropdown" id="user-menu-dropdown">
                            <a href="profile.html" class="user-menu-item">Profile</a>
                            <a href="settings.html" class="user-menu-item">Settings</a>
                            <div class="user-menu-divider"></div>
                            <button type="button" class="user-menu-item user-menu-logout" id="header-logout">Logout</button>
                        </div>
                    </div>
                </div>
            </div>
        </header>
        <main class="main-content app-body">
            <div class="page-header">
                <h1 class="page-title">Service Records</h1>
                <p class="page-subtitle">Log and review repairs, maintenance, inspections, and upgrades.</p>
            </div>
            <p id="message" class="message" aria-live="polite"></p>

            <section class="card mb-lg" aria-labelledby="service-form-heading">
                <div class="card-header">
                    <h2 id="service-form-heading" class="card-title">Log or edit a service record</h2>
                </div>
                <div class="card-body">
                    <form id="service-record-form">
                        <input id="service-record-id" type="hidden">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="product-id">Product</label>
                                <select id="product-id" class="form-select" required>
                                    <option value="">-- Select a product --</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="service-date">Service date</label>
                                <input id="service-date" type="date" class="form-input" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="service-type">Service type</label>
                                <select id="service-type" class="form-select" required>
                                    <option value="REPAIR">REPAIR</option>
                                    <option value="MAINTENANCE">MAINTENANCE</option>
                                    <option value="INSPECTION">INSPECTION</option>
                                    <option value="UPGRADE">UPGRADE</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="provider">Service provider</label>
                                <input id="provider" class="form-input" required maxlength="100" placeholder="e.g. Authorized Service Center, Quick Repair">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="cost">Cost (₹)</label>
                                <input id="cost" type="number" step="0.01" min="0" class="form-input" required placeholder="0.00">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="description">Problem / service description</label>
                                <textarea id="description" class="form-textarea" required maxlength="500" placeholder="Describe the issue or service performed..."></textarea>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button type="submit" id="submit-service-button" class="btn btn-primary">Save service record</button>
                            <button id="cancel-edit-button" type="button" class="btn btn-secondary">Cancel edit</button>
                        </div>
                    </form>
                </div>
            </section>

            <section class="card" aria-labelledby="service-list-heading">
                <div class="card-header">
                    <h2 id="service-list-heading" class="card-title">Service History</h2>
                    <button id="refresh-button" type="button" class="btn btn-secondary btn-sm">Refresh list</button>
                </div>
                <div class="card-body" style="padding: 0;">
                    <div class="table-wrapper">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Product</th>
                                    <th>Type</th>
                                    <th>Date</th>
                                    <th>Provider</th>
                                    <th>Cost</th>
                                    <th>Description</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="service-table-body"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="js/service-records.js"></script>
    <script>
        (async function guard() {
            const user = await checkAuth();
            if (!user) return;
            updateAuthUI(user);
            initUserMenu();
        })();
    </script>
</body>
</html>
